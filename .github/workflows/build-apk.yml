name: Build & Auto-Release APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Environment & Keystore
        run: |
          # Ensure .env file exists for Secrets Gradle plugin
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

          # Decode or generate debug.keystore for APK signing
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi

          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Package
        run: |
          mkdir -p release-apk
          # Copy generated APK to clean named file
          cp app/build/outputs/apk/debug/*.apk release-apk/Dhaka-2077.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dhaka-2077-APK
          path: release-apk/Dhaka-2077.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: "Traffic Controller: Dhaka 2077 (v1.0.0)"
          body: |
            ## 🚦 ট্রাফিক কনট্রোলার: ঢাকা ২০৭৭ (Traffic Controller: Dhaka 2077)
            
            গিটহাব অ্যাকশনের (GitHub Actions) মাধ্যমে স্বয়ংক্রিয়ভাবে বিল্ড ও রিলিজ হওয়া লেটেস্ট অ্যান্ড্রয়েড APK।

            ### 📥 ডাউনলোড নির্দেশিকা:
            - নিচের **Assets** সেকশন থেকে সরাসরি **`Dhaka-2077.apk`** ডাউনলোড করুন।
            - মোবাইলে ফাইলটি ওপেন করে ইন্সটল করুন।

            ### 🎮 গেমপ্লে ফিচারসমূহ:
            * **ডিজিটাল ট্রাফিক সিগন্যাল**: স্ক্রিনে ট্যাপ করে নিমেষেই উত্তর-দক্ষিণ ও পূর্ব-পশ্চিম সিগন্যাল বদলান।
            * **📢 হর্ন মিটার (Honk Meter)**: গাড়ি আটকে থাকলে চালকরা অনবরত হর্ন বাজায়, স্ক্রিন কাঁপতে থাকে। ১০০% হলে মোড় অচল হয়ে খেলা শেষ!
            * **🛸 হেভি-লিফটার ড্রোন**: জ্যাম ছাড়াতে নিয়ন ট্রাক্টর বিম দিয়ে বিকল বাস বা গাড়ি শূন্যে তুলে সরান।
            * **🚀 রকেট-লেগুনা**: লাল বাতিতে দাঁড়ালেই আগুন জ্বালিয়ে সিগন্যাল ভেঙে হুড়মুড় করে ছোটে।
            * **🚨 ভিআইপি প্রোটোকল**: হঠাৎ সাইরেন বাজিয়ে রাস্তা বন্ধ করবে, ব্যাকলগ নিয়ন্ত্রণ চ্যালেঞ্জ।
            * **🛺 জায়ান্ট রিকশা ও পথচারী**: অলস গতি এবং হুটহাট রাস্তা পারাপার।
            * **⚡ সাইবার গ্যাজেট**: ইএমপি শকওয়েভ, হলো-ব্যারিকেড ও সাইবার বাঁশি।
            * **৫টি ঢাকার মোড়**: ফার্মগেট, শাহবাগ, কুড়িল ফ্লাইওভার, মিরপুর ১০, গুলশান ২।
          files: release-apk/Dhaka-2077.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
